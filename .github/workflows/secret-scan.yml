name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine scan range
        id: scan-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA=0000000000000000000000000000000000000000
          LOG_OPTS=--all
          if [[ "$EVENT_NAME" == "pull_request" ]] \
            && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null \
            && git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
            LOG_OPTS="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "push" && "${BEFORE_SHA:-}" != "$ZERO_SHA" ]] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            LOG_OPTS="${BEFORE_SHA}..${CURRENT_SHA}"
          fi
          echo "log_opts=$LOG_OPTS" >> "$GITHUB_OUTPUT"

      - name: Scan for secrets
        env:
          LOG_OPTS: ${{ steps.scan-range.outputs.log_opts }}
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --verbose --log-opts="$LOG_OPTS" /repo
